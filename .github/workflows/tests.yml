name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test-formulas:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Homebrew
      if: ${{ env.ACT != 'true' }}
      uses: Homebrew/actions/setup-homebrew@main
      
    - name: Tap repository
      run: |
        # Remove tap if it already exists to avoid remote mismatch
        brew untap stuffbucket/tap 2>/dev/null || true
        # Create tap directory and symlink (avoids git remote issues with bind mounts)
        TAP_DIR="$(brew --repository)/Library/Taps/stuffbucket"
        sudo mkdir -p "$TAP_DIR"
        sudo ln -sfn "$(pwd)" "$TAP_DIR/homebrew-tap"
        # Homebrew refuses to LOAD formulae or casks from an untrusted
        # third-party tap, and a skipped tap is SILENT: it prints "Skipping ...
        # not trusted" and exits 0, so `brew audit` (already `|| true`) and
        # `brew search` would pass while exercising nothing.
        #
        # setup-homebrew already trusts the tap under test, so on a normal run
        # this is a no-op that prints "Already trusted". It is here for the ACT
        # path: that step is guarded by `if: env.ACT != 'true'`, so under
        # nektos/act nothing else performs the trust.
        brew trust stuffbucket/tap
        
    - name: Test formulas
      run: |
        for formula in Formula/*.rb; do
          if [ -f "$formula" ]; then
            formula_name=$(basename "$formula" .rb)
            echo "Auditing $formula_name..."
            # Allow failures for GoReleaser-generated formulas (def inside on_macos/on_linux blocks)
            brew audit --strict --online stuffbucket/tap/$formula_name || true
          fi
        done
        
    - name: Test tap search
      run: |
        brew search stuffbucket/tap/

    - name: Cleanup tap
      if: always()
      run: |
        brew untap stuffbucket/tap 2>/dev/null || true
        # Force remove the tap directory if it still exists
        sudo rm -rf /home/linuxbrew/.linuxbrew/Homebrew/Library/Taps/stuffbucket/homebrew-tap || true
        sudo rm -rf /home/linuxbrew/.linuxbrew/Homebrew/Library/Taps/stuffbucket || true
        # Create parent directory and empty file for action's post.sh to remove without errors
        sudo mkdir -p /home/linuxbrew/.linuxbrew/Homebrew/Library/Taps/stuffbucket || true
        sudo touch /home/linuxbrew/.linuxbrew/Homebrew/Library/Taps/stuffbucket/homebrew-tap || true