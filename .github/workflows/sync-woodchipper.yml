name: Sync woodchipper

# Copies the formula that stuffbucket/woodchipper attaches to its GitHub releases into Formula/:
#   woodchipper.rb   from the latest stable release (/releases/latest)
# Each formula is verified against that release's SHA256SUMS before it is written. Only public GitHub
# data is read, so no cross-repository secret is needed. The source repository may also send a
# repository_dispatch (type woodchipper-release) right after publishing, which only shortens the wait.
on:
  schedule:
    - cron: "15,45 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [woodchipper-release]

permissions:
  contents: write

concurrency:
  group: sync-woodchipper
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY: stuffbucket/woodchipper

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch, verify, and write formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          : > "$work/changes"

          stable_tag=$(gh api "repos/$SOURCE_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          if [ -z "$stable_tag" ] || [ "$stable_tag" = "null" ]; then
            echo "::notice::No published release in $SOURCE_REPOSITORY yet."
            echo "CHANGES=" >> "$GITHUB_ENV"
            exit 0
          fi

          formula=woodchipper
          version=${stable_tag#v}
          dir=$work/$formula
          mkdir -p "$dir"
          assets=$(gh release view "$stable_tag" --repo "$SOURCE_REPOSITORY" --json assets --jq '.assets[].name')
          if ! grep -qx "$formula.rb" <<<"$assets" || ! grep -qx SHA256SUMS <<<"$assets"; then
            echo "::notice::$stable_tag has no $formula.rb or SHA256SUMS; leaving Formula/$formula.rb as is."
            echo "CHANGES=" >> "$GITHUB_ENV"
            exit 0
          fi

          gh release download "$stable_tag" --repo "$SOURCE_REPOSITORY" --dir "$dir" \
            --pattern SHA256SUMS --pattern "$formula.rb"

          (cd "$dir" && grep -E "^[0-9a-f]{64}  $formula\.rb\$" SHA256SUMS | sha256sum --check --strict -)
          grep -qF "/releases/download/v$version/" "$dir/$formula.rb" || {
            echo "::error::$formula.rb does not download version $version"; exit 1; }
          while read -r digest archive; do
            grep -qF "\"$digest\"" "$dir/$formula.rb" || {
              echo "::error::$formula.rb lacks the SHA256SUMS digest of $archive"; exit 1; }
          done < <(grep -E "  woodchipper-v.*\.tar\.gz\$" "$dir/SHA256SUMS")
          ruby -c "$dir/$formula.rb" > /dev/null

          mkdir -p Formula
          if ! cmp -s "$dir/$formula.rb" "Formula/$formula.rb"; then
            cp "$dir/$formula.rb" "Formula/$formula.rb"
            echo "$formula $version" >> "$work/changes"
            echo "Updated Formula/$formula.rb to $version"
          else
            echo "Formula/$formula.rb is already at $version"
          fi
          echo "CHANGES=$(paste -sd ',' "$work/changes" | sed 's/,/, /g')" >> "$GITHUB_ENV"
      - name: Commit and push changes
        run: |
          set -euo pipefail
          if [ -z "$CHANGES" ]; then
            echo "Tap is up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula
          git commit -m "woodchipper: sync from stuffbucket/woodchipper releases ($CHANGES)"
          git push
